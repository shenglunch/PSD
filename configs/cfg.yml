train:
  dataset: 
    name: NK
    img_aug:
      horizontal_flip: 0.5
      normalized: true
      color_jitter: 0.4
      degree: 5.0
      scale: 1.5

  batch_size: 48
  accumulate_gradient: 1
  total_epoch: 45
  warmup_epochs: 1
  start_ratio: 0.1
  base_lr: 1e-3
  min_lr: 1e-5
  max_lr: 1e-3
  
  lr_scheduler:
    name: stage
    lr_epoch: [    0,      10,     20,  22,    25,       30,      35,      40]
    lrs:      [0.001, 0.00075, 0.0005, 0.0003, 0.00025, 0.000125, 0.00005, 0.00001]

  optimizer:
    name: adamw
    eps: 1e-8
    betas: [0.9, 0.999]
    weight_decay: 0.05

  weight:
    depth_weight: 1.0
    conf_weight: 1.0

RegressBranch:
  layer_dim: [256, 256, 256, 256] # midas/depthanything(v2)/depthpro/promptda=[256, 256, 256, 256] metricv2=[1024, 512, 258] unidepth=[512, 256, 128]
  branch_dim: 16
  dim: 16
  last_dim: 16
  backbone: resnet18
  resnet:
    dim: 32
    pretrained: /data/slchen/pretrained/resnet18.pth
    en_ch:  [None, None, 64, 128, 256]
    de_ch:  [None, None, 16,  32, 64]

CSLBranch:
  backbone: resnet18
  resnet:
    dim: 64
    pretrained: /data/slchen/pretrained/resnet18.pth
  ImgBranch:
    layer_dim: [256, 256, 256, 256] #[192, 384, 768, 1536] # midas/depthanything(v2)/depthpro/promptda=[256, 256, 256, 256] metricv2=[1024, 512, 258] unidepth=[512, 256, 128]
    branch_dim: 16
    dim: 16
    last_dim: 24
    resnet:
      en_ch: [  64, 128, 256, 512]
      de_ch: [None,  64, 128, 256]    
  PixBranch:
    resnet:
      dim: 16
      fuse_dim: 24
      feat_dim: 128
      last_dim: 16

MDEBranch:
  backbone: depthanything # depthanything depthanythingv2 midas depthpro metricv2 unidepth
  midas:
    backbone: swin2l24_384
    pretrained: /data/slchen/pretrained/dpt_swin2_large_384.pt
    resize_h: 384
    resize_w: 384
    mean: [0.5, 0.5, 0.5]
    std: [0.5, 0.5, 0.5]
  depany:
    backbone: vitl
    pretrained: /data/slchen/pretrained/depth_anything_vitl14.pth
    resize_h: 392
    resize_w: 392
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  depanyv2:
    backbone: vitl
    pretrained: /data/slchen/pretrained/depth_anything_v2_vitl.pth
    resize_h: 392
    resize_w: 392
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  depthpro:
    pretrained: /data/slchen/pretrained/depth_pro.pt
    resize_h: 384
    resize_w: 384
    mean: [0.5, 0.5, 0.5]
    std: [0.5, 0.5, 0.5]
  promptda:
    pretrained: /data/slchen/pretrained/prompt_da_model_large.ckpt
    resize_h: 384
    resize_w: 384
  metricv2:
    backbone: /data/slchen/paper-large6/DC-rebuttal-x/network/metric3d/mono/configs/HourglassDecoder/vit.raft5.large.py
    pretrained: /data/slchen/pretrained/metric_depth_vit_large_800k.pth
    resize_h: 384
    resize_w: 384
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  unidepth:
    backbone: /public/home/csl/paper-robust/DC-rebuttal5/network/unidepth/configs/config_v2_vitl14.json
    pretrained: /data/slchen/pretrained/unidepth_v2_vitl14.bin
    resize_h: 384
    resize_w: 384
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

